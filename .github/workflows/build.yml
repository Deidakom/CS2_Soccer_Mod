name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build plugin (Release)
        run: dotnet build src/server-plugin/SoccerModMvp/SoccerModMvp.csproj -c Release

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: npm test

      - name: Test KICKOFF services
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

      - name: Test managed gameplay logic
        run: dotnet run --project test/managed/ActivityTests.csproj -c Release

      - name: Build release smoke-test package
        shell: pwsh
        run: ./tools/build-public-release.ps1 -Version 0.0.0-ci

      - name: Smoke-test release installer
        run: sudo bash test/release-install-smoke.sh artifacts/releases/CS2-SoccerMod-0.0.0-ci-server.zip

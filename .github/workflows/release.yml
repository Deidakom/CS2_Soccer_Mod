name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # soccermod_native.dll from this tag's source (MSVC).
  windows-native:
    uses: ./.github/workflows/native-windows.yml

  package:
    needs: windows-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build plugin (Release)
        run: dotnet build src/server-plugin/SoccerModMvp/SoccerModMvp.csproj -c Release

      # Rebuild the native bridge from this tag's source in an ubuntu:20.04
      # container (glibc 2.31), so the release loads on older hosts too; the
      # script fails if the result needs a newer glibc.
      - name: Build portable native bridge (Linux)
        run: bash deploy/native/build-portable.sh --install

      - name: Take the Windows native bridge
        uses: actions/download-artifact@v4
        with:
          name: soccermod_native-windows
          path: deploy/release/payload-windows/game/csgo/addons/soccermod_native/bin/win64

      # Plugin-only package for servers that already run Metamod and
      # CounterStrikeSharp (install.sh = the old installer).
      - name: Build plugin-only package
        shell: pwsh
        run: ./tools/build-public-release.ps1 -Version ${{ github.ref_name }}

      # Drop-in packages: everything a fresh Linux or Windows server needs.
      - name: Build drop-in packages
        run: bash tools/build-dropin-release.sh ${{ github.ref_name }}

      - name: Smoke-test the Linux drop-in install
        run: bash test/dropin-install-smoke.sh "artifacts/releases/CS2-SoccerMod-${GITHUB_REF_NAME#v}-linux.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            artifacts/releases/*.zip
            artifacts/releases/*.zip.sha256

  windows-smoke:
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Install into a fake server and check gameinfo.gi
        shell: pwsh
        run: |
          $zip = Get-ChildItem release -Filter '*-windows.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath unzipped
          $release = Get-ChildItem unzipped -Directory | Select-Object -First 1
          $server = Join-Path $PWD 'server'
          New-Item -ItemType Directory -Force (Join-Path $server 'game\csgo') | Out-Null
          $gi = Join-Path $server 'game\csgo\gameinfo.gi'
          [IO.File]::WriteAllText($gi, "`"GameInfo`"`r`n{`r`n`tFileSystem`r`n`t{`r`n`t`tSearchPaths`r`n`t`t{`r`n`t`t`tGame_LowViolence`tcsgo_lv`r`n`t`t`tGame`tcsgo`r`n`t`t}`r`n`t}`r`n}`r`n")
          Copy-Item -Recurse -Force (Join-Path $release.FullName '*') $server
          & (Join-Path $server 'install.ps1') -Root $server
          & (Join-Path $server 'install.ps1') -Root $server
          $text = [IO.File]::ReadAllText($gi)
          if (([regex]::Matches($text, 'csgo/addons/metamod')).Count -ne 1) { throw 'Metamod line not added exactly once' }
          if (-not $text.Contains("`t`t`tGame_LowViolence`tcsgo_lv`r`n`t`t`tGame`tcsgo/addons/metamod`r`n")) { throw 'Metamod line in the wrong place or without CRLF' }
          if (-not (Test-Path "$gi.soccermod.bak")) { throw 'no backup' }

  publish:
    needs: [package, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: artifacts/releases

      - name: Read release notes
        id: notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $notesPath = "docs/releases/$version.md"
          $body = if (Test-Path -LiteralPath $notesPath) {
            Get-Content -LiteralPath $notesPath -Raw
          } else {
            "See CHANGELOG.md for details."
          }
          $delimiter = "EOF_$([guid]::NewGuid().ToString('N'))"
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CS2 SoccerMod ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          # Remove this line (or delete deploy/release/PRERELEASE) once a
          # release is considered stable enough to drop the pre-release tag.
          prerelease: ${{ hashFiles('deploy/release/PRERELEASE') != '' }}
          files: |
            artifacts/releases/*.zip
            artifacts/releases/*.zip.sha256

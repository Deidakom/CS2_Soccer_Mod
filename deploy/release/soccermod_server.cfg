// CS2 SoccerMod recommended baseline (matches the KA Soccer Mod public server, v1.5.0).
// Review before adding `exec soccermod_server.cfg` to your server startup.

sv_cheats 0
sv_allow_votes 0
bot_quota 0
bot_kick

// SoccerMod uses the knife's primary attack as its only kick input.
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_ct_default_primary ""
mp_t_default_primary ""
mp_ct_default_secondary ""
mp_t_default_secondary ""

mp_warmup_online_enabled false
mp_warmup_offline_enabled false
mp_warmuptime 0
mp_warmup_pausetimer 0
mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 0
mp_autokick 0
mp_freezetime 0
mp_buytime 0
mp_roundtime 60
mp_ignore_round_win_conditions 1
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1

sv_alltalk 1

// Teammates block each other's kicks/runs, CS:S-style (default CS2
// behaviour only makes teammates solid during freezetime).
mp_solid_teammates 1

// In this CS2 build, 0 means the match is already over. Do not use 0.
mp_maxrounds 999999

// No landing sound (replicated, so it also mutes the client-predicted own landing).
sv_min_jump_landing_sound 100000

// No team intro countdown after a map (re)load - play starts directly.
mp_team_intro_time 0

// No sound rings (knife, steps) on the minimap.
snd_disable_radar_visualize true

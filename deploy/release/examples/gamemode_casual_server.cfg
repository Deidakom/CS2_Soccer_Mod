// Goes to game/csgo/cfg/gamemode_casual_server.cfg
//
// CS2 executes this file right AFTER gamemode_casual.cfg on every map load
// (the server runs +game_type 0 +game_mode 0 = Casual). gamemode_casual.cfg
// turns warmup back on (mp_warmuptime 90), so the SoccerMod settings have to
// be re-applied here, after it.
mp_warmup_online_enabled false
mp_warmup_offline_enabled false
mp_warmuptime 0
mp_warmup_pausetimer 0

// In this CS2 build mp_maxrounds 0 means "the match is already over": players
// freeze and !rr does nothing. Use a very large number instead.
mp_maxrounds 999999

// Re-assert the SoccerMod baseline that the gamemode cfg also overwrites.
exec soccermod_server.cfg

// MultiAddonManager config for CS2 SoccerMod.
// Goes to game/csgo/cfg/multiaddonmanager/multiaddonmanager.cfg
//
// 3797479770 = "CS:2 - SoccerMod Feature Package" (jerseys, clickable menu,
// ball/kick sounds, radar). Clients download it when they join.
mm_extra_addons "3797479770"
mm_client_extra_addons ""
mm_extra_addons_timeout 60
mm_addon_connection_timeout 120
mm_addon_mount_download 0
mm_cache_clients_with_addons 1
mm_cache_clients_duration 0

// Keep this at 0: with CS2 1.41.8.3+ and MultiAddonManager v1.6.1, blocking
// disconnect messages crashes the server when a player connects
// (Source2ZE/MultiAddonManager issue #77).
mm_block_disconnect_messages 0
mm_addon_debug 0

// Optional client-side setup: copy into your CS2 cfg folder and run
// exec soccermod_menu
// This replaces number-key/F10 bindings with SoccerMod menu bindings.
// Let spectator controls honor the custom bindings instead of swallowing raw digits.
spec_usenumberkeys_nobinds 0
bind 1 css_1
bind 2 css_2
bind 3 css_3
bind 4 css_4
bind 5 css_5
bind 6 css_6
bind 7 css_7
bind 8 css_8
bind 9 css_9
bind 0 css_0
bind F10 css_menu

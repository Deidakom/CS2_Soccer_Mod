// CS2 executes this file immediately AFTER gamemode_casual.cfg on every
// map load. That ordering is the whole point of it existing.
//
// 2026-08-30: the "Warmup 1:30" panel the user reported is CS2's own
// warmup HUD, and 1:30 is literally gamemode_casual.cfg's own
// "mp_warmuptime 90". Setting warmup cvars in soccermod_test.cfg does
// NOT work - that file runs BEFORE the gamemode cfg, which then
// overwrites mp_warmuptime right back to 90. Note also that
// mp_do_warmup_period does not exist in this build at all.
//
// The server runs +game_type 0 +game_mode 0, i.e. Casual, so this is the
// gamemode cfg that applies.
mp_warmup_online_enabled false
mp_warmup_offline_enabled false
mp_warmuptime 0
mp_warmup_pausetimer 0

// 2026-08-30, fixed after breaking it earlier the same day: this is the
// cfg prerequisite for css_sm2goal_roundwin (native CS2 round-win via
// CCSGameRules.TerminateRound on each goal, default OFF, still
// unverified). The goal was always "CS2's own match-end logic should
// never trigger", NOT "set these to 0" - 0 means something different per
// cvar and turned out to be catastrophic for one of them:
//   - mp_maxrounds 0 does NOT mean "unlimited" (unlike some other Source
//     titles) - it means the match is ALREADY OVER before round 1 starts.
//     Confirmed live via css_sm2_move_probe's gamerules dump:
//     roundStartTime never advanced across multiple manual mp_restartgame
//     calls, freezePeriod stuck true indefinitely, and CS2 locks client
//     movement input during an unresolved freeze period - explaining
//     frozen walking, dead sprint, unslayable players, and "!match
//     start"/"!rr" doing nothing, all as ONE bug. A live RCON change back
//     to a sane value did NOT fix it - the engine had already latched the
//     "match over" decision; needed a full service restart to clear.
//   - The actual "never trigger" value is a very large number instead.
//   - mp_halftime's own CS2 default is already "false" in this gamemode
//     (confirmed live) - it never needed setting at all, so it is
//     deliberately left untouched here rather than pinned to a literal
//     that might carry the same kind of wrong assumption.
// Verified after this fix (same method as the bug report): freezePeriod
// reads false, and roundStartTime genuinely advances after !rr.
mp_maxrounds 999999

// Re-assert the SoccerMod baseline that the gamemode cfg also stomps.
exec soccermod_test.cfg

// CS2 SoccerMod MVP test server
hostname "CS2 SoccerMod Test"

sv_lan 0
sv_cheats 0
sv_hibernate_when_empty 0
sv_allow_votes 0

// Private test server (2026-08-30, user request). Set your own password
// here locally - this file is templated in the public repo, the real
// value should never be committed.
sv_password "REPLACE_WITH_A_PASSWORD"

bot_quota 0
bot_kick

// SoccerMod uses the knife's primary attack as its only kick input.
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
mp_ct_default_primary ""
mp_t_default_primary ""
mp_ct_default_secondary ""
mp_t_default_secondary ""

// No warmup at all (2026-08-30, user request): its countdown panel shares
// the centre-screen HUD region with the !menu and made the menu glitch.
// mp_do_warmup_period does NOT exist in this build, and mp_warmuptime
// alone is not enough (it only shortens the period and reads back
// re-clamped). These two are the cvars that actually work.
mp_warmup_online_enabled false
mp_warmup_offline_enabled false

mp_autoteambalance 0
mp_limitteams 0
mp_friendlyfire 0
mp_autokick 0
mp_freezetime 0
mp_buytime 0
mp_roundtime 60
mp_ignore_round_win_conditions 1
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1

sv_alltalk 1
